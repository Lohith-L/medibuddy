<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme before anything renders (no white flash): same key and rules as ThemeContext. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("medibuddy.theme") || "system";
          var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          if (dark) r.classList.add("dark");
          r.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <style>
      html { background: #fff; }
      html.dark { background: #0b1120; }
      .boot { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .boot img { width: min(60vw, 280px); height: auto; }
      .boot .boot-dark, html.dark .boot .boot-light { display: none; }
      html.dark .boot .boot-dark { display: block; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>MediBuddy - Smart Medicine Reminder for Elderly Patients</title>
    <meta name="description" content="AI-powered medicine reminder app for elderly Indian patients. Upload prescriptions, get multilingual reminders, and keep family informed." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="author" content="MediBuddy" />

    <meta property="og:title" content="MediBuddy - Smart Medicine Reminder" />
    <meta property="og:description" content="AI-powered medicine reminder app for elderly Indian patients." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MediBuddy - Your Smart Health Companion" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MediBuddy" />
    <meta name="twitter:image" content="/og-image.png" />
  </head>

  <body>
    <!-- Shown until the app has loaded (React replaces it). -->
    <div id="root"><div class="boot"><img class="boot-light" src="/brand/logo-full.png" alt="MediBuddy - Your Smart Health Companion" /><img class="boot-dark" src="/brand/logo-full-dark.png" alt="MediBuddy - Your Smart Health Companion" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
